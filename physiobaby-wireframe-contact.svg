<svg viewBox="0 0 800 1300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="1300" fill="#FBF8F2"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#2B2318">Wireframe — Contact</text>

  <rect x="40" y="50" width="720" height="1220" fill="#ffffff" stroke="#2B2318" stroke-width="1.5"/>

  <!-- Header (same global) -->
  <rect x="40" y="50" width="720" height="60" fill="none" stroke="#2B2318" stroke-width="1"/>
  <rect x="60" y="65" width="70" height="30" fill="#e5e2dc" stroke="#9a9a9a"/>
  <text x="95" y="84" text-anchor="middle" font-size="9" fill="#777">Logo</text>
  <text x="330" y="85" font-size="11" fill="#555">Servicii</text>
  <text x="410" y="85" font-size="11" fill="#555">Afecțiuni</text>
  <text x="500" y="85" font-size="11" fill="#555">Prețuri</text>
  <rect x="620" y="65" width="110" height="30" fill="#2B2318"/>
  <text x="675" y="85" text-anchor="middle" font-size="10.5" fill="#FBF8F2">Contact</text>

  <!-- WhatsApp quick band — most prominent element -->
  <rect x="40" y="110" width="720" height="90" fill="#e8dfc8" stroke="#af5234" stroke-width="1.5"/>
  <circle cx="100" cy="155" r="20" fill="#af5234"/>
  <text x="100" y="160" text-anchor="middle" font-size="9" fill="#FBF8F2">WA</text>
  <rect x="140" y="140" width="360" height="14" fill="#d8d4cb"/>
  <text x="320" y="151" text-anchor="middle" font-size="9" fill="#777">Scrie-ne direct pe WhatsApp</text>
  <rect x="560" y="140" width="150" height="30" fill="#af5234"/>
  <text x="635" y="160" text-anchor="middle" font-size="10" fill="#FBF8F2">Deschide WhatsApp</text>
  <text x="700" y="192" text-anchor="end" font-size="8.5" fill="#af5234">cel mai proeminent element al paginii</text>

  <!-- 4-info grid -->
  <g>
    <rect x="70" y="230" width="150" height="90" fill="none" stroke="#2B2318" stroke-width="1"/>
    <text x="145" y="265" text-anchor="middle" font-size="9" fill="#999">Telefon</text>
    <rect x="95" y="280" width="100" height="10" fill="#e5e2dc"/>

    <rect x="240" y="230" width="150" height="90" fill="none" stroke="#2B2318" stroke-width="1"/>
    <text x="315" y="265" text-anchor="middle" font-size="9" fill="#999">Email</text>
    <rect x="265" y="280" width="100" height="10" fill="#e5e2dc"/>

    <rect x="410" y="230" width="150" height="90" fill="none" stroke="#2B2318" stroke-width="1"/>
    <text x="485" y="265" text-anchor="middle" font-size="9" fill="#999">Adresă</text>
    <rect x="435" y="280" width="100" height="10" fill="#e5e2dc"/>

    <rect x="580" y="230" width="150" height="90" fill="none" stroke="#2B2318" stroke-width="1"/>
    <text x="655" y="265" text-anchor="middle" font-size="9" fill="#999">Program</text>
    <rect x="605" y="280" width="100" height="10" fill="#e5e2dc"/>
  </g>

  <!-- Map -->
  <rect x="70" y="350" width="660" height="220" fill="#eae6dd" stroke="#2B2318" stroke-width="1"/>
  <text x="400" y="460" text-anchor="middle" font-size="11" fill="#999">[ hartă interactivă — Google Maps embed ]</text>
  <text x="400" y="600" text-anchor="middle" font-size="9" fill="#af5234">Deschide în Google Maps →</text>

  <!-- FAQ accordion -->
  <text x="70" y="650" font-size="11" fill="#af5234">Întrebări frecvente</text>
  <g>
    <rect x="70" y="665" width="660" height="40" fill="none" stroke="#c9c5bc"/>
    <text x="90" y="690" font-size="10" fill="#555">De la ce vârstă?</text>
    <text x="710" y="690" text-anchor="end" font-size="12" fill="#999">+</text>

    <rect x="70" y="710" width="660" height="40" fill="none" stroke="#c9c5bc"/>
    <text x="90" y="735" font-size="10" fill="#555">Cum mă programez?</text>
    <text x="710" y="735" text-anchor="end" font-size="12" fill="#999">+</text>

    <rect x="70" y="755" width="660" height="40" fill="none" stroke="#c9c5bc"/>
    <text x="90" y="780" font-size="10" fill="#555">Cât durează?</text>
    <text x="710" y="780" text-anchor="end" font-size="12" fill="#999">+</text>

    <rect x="70" y="800" width="660" height="40" fill="none" stroke="#c9c5bc"/>
    <text x="90" y="825" font-size="10" fill="#555">Se fac deplasări la domiciliu?</text>
    <text x="710" y="825" text-anchor="end" font-size="12" fill="#999">+</text>
  </g>

  <!-- Bottom CTA -->
  <rect x="40" y="870" width="720" height="90" fill="#2B2318"/>
  <text x="400" y="910" text-anchor="middle" font-size="13" fill="#FBF8F2">Ești gata să faci primul pas?</text>
  <rect x="330" y="925" width="140" height="26" fill="#af5234"/>
  <text x="400" y="942" text-anchor="middle" font-size="10" fill="#2B2318">Programează-te</text>

  <!-- Footer (same global, compact) -->
  <rect x="40" y="960" width="720" height="230" fill="#f3f1ec" stroke="#2B2318" stroke-width="1"/>
  <rect x="70" y="990" width="150" height="14" fill="#e5e2dc"/>
  <text x="145" y="1000" text-anchor="middle" font-size="8" fill="#999">Brand + tagline</text>
  <rect x="300" y="990" width="150" height="60" fill="#efece5"/>
  <text x="375" y="1025" text-anchor="middle" font-size="8" fill="#999">Contact (tel/email/adresă)</text>
  <rect x="530" y="990" width="150" height="60" fill="#efece5"/>
  <text x="605" y="1025" text-anchor="middle" font-size="8" fill="#999">Legal (confidențialitate, T&amp;C, ANPC)</text>
  <line x1="70" y1="1150" x2="730" y2="1150" stroke="#c9c5bc"/>
  <text x="400" y="1170" text-anchor="middle" font-size="9" fill="#999">© 2026</text>

  <!-- floating whatsapp -->
  <circle cx="710" cy="1220" r="18" fill="#af5234"/>
  <text x="710" y="1224" text-anchor="middle" font-size="8" fill="#FBF8F2">WA</text>
  <text x="710" y="1250" text-anchor="middle" font-size="8" fill="#999">buton flotant, redundant aici — deja vizibil</text>
</svg>
